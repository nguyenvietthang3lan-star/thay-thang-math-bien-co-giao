<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Khám phá biến cố giao</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#f5f7fb}
.container{width:800px;margin:auto;background:white;padding:20px;border-radius:15px}
canvas{border:2px solid #333;background:white;cursor:crosshair}
button{padding:12px 25px;margin:10px;border:none;border-radius:8px;font-size:16px;cursor:pointer;background:#2563eb;color:white}
#result{font-size:20px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>Khám phá biến cố giao</h1>
<p>Hãy tô màu phần giao nhau của hai biến cố A và B, sau đó nhấn Kiểm tra đáp án.</p>
<canvas id="venn" width="700" height="450"></canvas><br>
<button onclick="checkAnswer()">Kiểm tra đáp án</button>
<button onclick="clearCanvas()">Làm lại</button>
<div id="result"></div>
</div>

<script>
let canvas=document.getElementById("venn");
let ctx=canvas.getContext("2d");

let A={x:300,y:220,r:150};
let B={x:400,y:220,r:150};

function draw(){
ctx.clearRect(0,0,700,450);

ctx.beginPath();ctx.arc(A.x,A.y,A.r,0,Math.PI*2);
ctx.strokeStyle="blue";ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle="rgba(0,0,255,0.15)";ctx.fill();

ctx.beginPath();ctx.arc(B.x,B.y,B.r,0,Math.PI*2);
ctx.strokeStyle="red";ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle="rgba(255,0,0,0.15)";ctx.fill();

ctx.font="30px Arial";
ctx.fillStyle="blue";ctx.fillText("A",230,100);
ctx.fillStyle="red";ctx.fillText("B",470,100);

let items=[["1",220,220],["2",300,130],["3",350,220],["4",400,220],["5",450,130],["6",520,220]];
ctx.font="22px Arial";ctx.fillStyle="black";
items.forEach(i=>ctx.fillText(i[0],i[1],i[2]));
}
draw();

let painting=false;
canvas.onmousedown=e=>{painting=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};
canvas.onmousemove=e=>{
if(painting){
ctx.lineTo(e.offsetX,e.offsetY);
ctx.strokeStyle="green";ctx.lineWidth=20;ctx.lineCap="round";ctx.stroke();
}};
canvas.onmouseup=()=>painting=false;

function clearCanvas(){draw();document.getElementById("result").innerHTML=""}

function checkAnswer(){
let d=ctx.getImageData(0,0,700,450).data;
let total=0,correct=0;
for(let x=0;x<700;x++)for(let y=0;y<450;y++){
let i=(y*700+x)*4;
let painted=d[i+1]>80 && d[i]<80;
let inA=Math.hypot(x-A.x,y-A.y)<A.r;
let inB=Math.hypot(x-B.x,y-B.y)<B.r;
if(inA&&inB){total++;if(painted)correct++;}
}
let ratio=correct/total;
let r=document.getElementById("result");
if(ratio>0.55){r.innerHTML="✅ Chính xác! Đây là phần giao A ∩ B";r.style.color="green";}
else{r.innerHTML="❌ Chưa đúng. Hãy tô phần hai biến cố cùng xảy ra.";r.style.color="red";}
}
</script>
</body>
</html>
